<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Quiz Kingdom - 100 Categories Edition</title>
  
  <!-- Google Fonts, Font Awesome & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-light: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .header-bar {
      width: 100%;
      max-width: 1100px;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);

      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-stats {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: var(--bg-light);
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .stat-badge.points { color: #facc15; }
    .stat-badge.stars { color: #f59e0b; }
    .stat-badge.title { color: #38bdf8; }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .filter-btn {
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-sub);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .cat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .cat-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 12px 20px rgba(99, 102, 241, 0.2);
    }

    .cat-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--bg-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .cat-title {
      font-weight: 800;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .cat-meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
    }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .stage-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .stage-card:not(.locked):hover {
      transform: translateY(-4px);
    }

    .stage-card.locked {
      opacity: 0.5;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .stage-number {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--primary);
    }

    .stage-stars {
      color: #f59e0b;
      font-size: 1.2rem;
      display: flex;
      gap: 4px;
    }

    .quiz-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-light);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 100%;
      transition: width 0.1s linear;
    }

    .subject-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: #0284c7;
      color: white;
    }

    .quiz-question {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      background: var(--bg-light);
      border: 2px solid transparent;
      padding: 16px 20px;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #3e4c5e;
    }

    .option-btn.correct {
      background: #065f46 !important;
      border-color: var(--success) !important;
    }

    .option-btn.wrong {
      background: #991b1b !important;
      border-color: var(--danger) !important;
    }

    .game-items-bar {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .item-use-btn {
      background: var(--bg-light);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .shop-item {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius);
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="logo" onclick="showView('category-view')">
      <i class="fa-solid fa-crown"></i> SUPER QUIZ KINGDOM
    </div>
    <div class="user-stats">
      <div class="stat-badge title" id="equipped-title"><i class="fa-solid fa-award"></i> 초보 퀴즈러</div>
      <div class="stat-badge stars"><i class="fa-solid fa-star"></i> <span id="total-stars">0</span></div>
      <div class="stat-badge points"><i class="fa-solid fa-coins"></i> <span id="user-points">0</span>P</div>
    </div>
    <div class="nav-btns">
      <button class="btn btn-secondary" onclick="showView('shop-view')"><i class="fa-solid fa-cart-shopping"></i> 상점</button>
      <button class="btn btn-secondary" onclick="showView('title-view')"><i class="fa-solid fa-trophy"></i> 칭호</button>
    </div>
  </div>

  <div class="container">
    <!-- Category View -->
    <div id="category-view" class="view active">
      <div class="controls-bar">
        <input type="text" id="search-bar" class="search-input" placeholder="퀴즈 카테고리 검색 (예: 초1, 수학, K-POP, 우주)..." oninput="filterCategories()">
        <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
        <button class="filter-btn" onclick="setFilter('school', this)">학교/교과</button>
        <button class="filter-btn" onclick="setFilter('trend', this)">트렌드/문화</button>
        <button class="filter-btn" onclick="setFilter('hobby', this)">취미/상식</button>
      </div>

      <div class="category-grid" id="category-grid"></div>
    </div>

    <!-- Stage View -->
    <div id="stage-view" class="view">
      <div class="stage-header">
        <button class="btn btn-secondary" onclick="showView('category-view')"><i class="fa-solid fa-arrow-left"></i> 뒤로가기</button>
        <h2 id="stage-cat-title">카테고리 이름</h2>
      </div>
      <div class="stage-grid" id="stage-grid"></div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" class="view">
      <div class="quiz-card" id="quiz-card">
        <div class="quiz-progress-bar">
          <div class="quiz-progress-fill" id="timer-bar"></div>
        </div>
        <span class="subject-badge" id="subject-badge">과목</span>
        <div style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px;" id="quiz-num">문제 1/5</div>
        <div class="quiz-question" id="quiz-question">퀴즈 질문이 들어갑니다.</div>

        <div class="options-grid" id="options-grid"></div>

        <div class="game-items-bar">
          <button class="item-use-btn" onclick="useItem('time')"><i class="fa-solid fa-clock"></i> 시간+10s (<span id="item-time-cnt">0</span>)</button>
          <button class="item-use-btn" onclick="useItem('hint')"><i class="fa-solid fa-lightbulb"></i> 힌트 (<span id="item-hint-cnt">0</span>)</button>
          <button class="item-use-btn" onclick="useItem('double')"><i class="fa-solid fa-bolt"></i> 점수2배 (<span id="item-double-cnt">0</span>)</button>
        </div>
      </div>
    </div>

    <!-- Result View -->
    <div id="result-view" class="view">
      <div class="quiz-card" style="text-align: center;">
        <h2 style="font-size: 2rem; margin-bottom: 12px;" id="result-title">STAGE CLEAR!</h2>
        <div id="result-stars" style="font-size: 2.5rem; color: #f59e0b; margin-bottom: 16px;">
          <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
        </div>
        <p style="font-size: 1.2rem; margin-bottom: 8px;">획득 점수: <span id="result-score" style="color:#facc15; font-weight:800;">0</span> 점</p>
        <p style="font-size: 1rem; color: var(--text-sub); margin-bottom: 24px;">정답률: <span id="result-acc">0</span>%</p>
        <button class="btn" style="margin: 0 auto;" onclick="showView('stage-view')">스테이지 목록으로</button>
      </div>
    </div>

    <!-- Shop View -->
    <div id="shop-view" class="view">
      <div class="stage-header">
        <button class="btn btn-secondary" onclick="showView('category-view')"><i class="fa-solid fa-arrow-left"></i> 메인으로</button>
        <h2>포인트 아이템 상점</h2>
      </div>
      <div class="shop-grid">
        <div class="shop-item">
          <h3><i class="fa-solid fa-clock" style="color:#38bdf8;"></i> 시간 연장 (+10초)</h3>
          <p style="color: var(--text-sub); font-size: 0.9rem;">퀴즈 타이머 제한 시간을 리셋하고 여유를 제공합니다.</p>
          <button class="btn" onclick="buyItem('time', 100)">100 P 구매</button>
        </div>
        <div class="shop-item">
          <h3><i class="fa-solid fa-lightbulb" style="color:#facc15;"></i> 힌트 아이템</h3>
          <p style="color: var(--text-sub); font-size: 0.9rem;">정답에 대한 힌트를 즉시 확인할 수 있습니다.</p>
          <button class="btn" onclick="buyItem('hint', 150)">150 P 구매</button>
        </div>
        <div class="shop-item">
          <h3><i class="fa-solid fa-bolt" style="color:#ec4899;"></i> 점수 2배 버프</h3>
          <p style="color: var(--text-sub); font-size: 0.9rem;">해당 문제 정답 시 점수를 2배로 획득합니다.</p>
          <button class="btn" onclick="buyItem('double', 200)">200 P 구매</button>
        </div>
      </div>
    </div>

    <!-- Title View -->
    <div id="title-view" class="view">
      <div class="stage-header">
        <button class="btn btn-secondary" onclick="showView('category-view')"><i class="fa-solid fa-arrow-left"></i> 메인으로</button>
        <h2>보유 칭호 보관함</h2>
      </div>
      <div class="shop-grid" id="titles-grid"></div>
    </div>
  </div>

  <!-- Modal Component for System Messages (Replacing alert) -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
      <h3 id="modal-msg" style="margin-bottom: 20px; line-height: 1.5;">메시지</h3>
      <button class="btn" style="margin: 0 auto;" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    function showModal(msg) {
      document.getElementById('modal-msg').innerText = msg;
      document.getElementById('custom-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    let gameState = {
      points: 100,
      stars: 0,
      equippedTitle: "초보 퀴즈러",
      unlockedTitles: ["초보 퀴즈러"],
      inventory: { time: 2, hint: 2, double: 1 },
      stageProgress: {}
    };

    if (localStorage.getItem('quiz_kingdom_state')) {
      try { gameState = JSON.parse(localStorage.getItem('quiz_kingdom_state')); } catch(e){}
    }

    function saveState() {
      localStorage.setItem('quiz_kingdom_state', JSON.stringify(gameState));
      updateHeaderUI();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // Comprehensive Quiz Database for Trend and Hobby categories
    const knowledgeDB = {
      "유튜버 / 크리에이터": [
        { q: "대한민국 최초로 구독자 1000만 명을 돌파한 보람튜브의 주요 콘텐츠 분야는?", ans: "키즈/일상", wrong: ["게임", "요리", "음악"] },
        { q: "유튜브에서 1,000,000(100만) 구독자를 달성했을 때 지급되는 버튼의 명칭은?", ans: "골드 버튼", wrong: ["실버 버튼", "다이아몬드 버튼", "루비 버튼"] },
        { q: "과학 연출 및 실험을 재미있게 다루는 인기 유투버 채널 이름은?", ans: "사물궁이 잡학사전", wrong: ["피지컬갤러리", "워크맨", "침착맨"] },
        { q: "세계에서 가장 많은 구독자를 보유한 개인 크리에이터 미스터비스트(MrBeast)의 본명은?", ans: "지미 도널드슨", wrong: ["퓨디파이", "로건 폴", "마키플라이어"] },
        { q: "웹예능 '문명특급'의 메인 진행자로 유명한 크리에이터는?", ans: "재재", wrong: ["풍자", "곽튜브", "빠니보틀"] }
      ],
      "정치인 & 역사 리더": [
        { q: "조선 시대 한글(훈민정음)을 창제한 임금은?", ans: "세종대왕", wrong: ["정조", "태종", "영조"] },
        { q: "미국의 제1대 대통령으로 초상화가 1달러 지폐에 그려진 인물은?", ans: "조지 워싱턴", wrong: ["에이브러햄 링컨", "토머스 제퍼슨", "벤저민 프랭클린"] },
        { q: "임진왜란 당시 한산도 대첩 및 명량 대첩을 이끈 조선의 장군은?", ans: "이순신", wrong: ["강감찬", "김유신", "을지문덕"] },
        { q: "고려를 건국하고 삼국을 통일한 왕은?", ans: "태조 왕건", wrong: ["경순왕", "대조영", "궁예"] },
        { q: "프랑스의 영웅으로 불리며 파리 시내에 '나폴레옹 관'이 위치한 역사적 인물은?", ans: "나폴레옹 보나파르트", wrong: ["잔다르크", "루이 14세", "샤를마뉴"] }

        { q: "프랑스의 명품 브랜드로 'C' 모양이 서로 교차된 로고로 유명한 브랜드는?", ans: "샤넬 (Chanel)", wrong: ["루이비통", "구찌", "에르메스"] },
        { q: "스포츠 브랜드 중 'Just Do It' 슬로건과 로고(Swoosh)로 유명한 브랜드는?", ans: "나이키 (Nike)", wrong: ["아디다스", "푸마", "뉴발란스"] }
      ]
    };

    const categories = [];
    const subjects = ["수학", "국어", "영어", "사회", "과학"];
    
    const grades = ["초등 1학년", "초등 2학년", "초등 3학년", "초등 4학년", "초등 5학년", "초등 6학년", "중학교 1학년", "중학교 2학년", "중학교 3학년"];
    grades.forEach((g, idx) => {
      subjects.forEach(sub => {
        let icon = "fa-book";
        if (sub === "수학") icon = "fa-calculator";
        else if (sub === "영어") icon = "fa-language";
        else if (sub === "사회") icon = "fa-globe";
        else if (sub === "과학") icon = "fa-flask";

        categories.push({
          id: `grade_${idx}_${sub}`,
          title: `${g} [${sub}]`,
          icon: icon,
          type: "school",
          subject: sub,
          gradeLevel: idx + 1
        });
      });
    });

    const trends = [
      { name: "유튜버 / 크리에이터", icon: "fa-youtube" }, { name: "정치인 & 역사 리더", icon: "fa-landmark" },
      { name: "철도 & 지하철", icon: "fa-train-subway" }, { name: "아이돌 / K-POP", icon: "fa-music" },
      { name: "애니 & 웹툰", icon: "fa-tv" }, { name: "게임 & 이스포츠", icon: "fa-gamepad" },
      { name: "신조어 & 밈", icon: "fa-comments" }, { name: "영화 & OTT", icon: "fa-film" }
    ];
    trends.forEach(t => categories.push({ id: t.name, title: t.name, icon: t.icon, type: "trend", subject: "문화/트렌드" }));

    const hobbies = [
      "세계 수도", "세계 역사", "음식 & 맛집", "스포츠 & 축구", "동물 & 자연", "과학 & 우주", "자동차 & 탈것",
      "속담 & 사자성어", "IT & 코딩", "클래식 음악", "미술 & 명화", "경제 & 주식", "보드게임", "패션 & 브랜드"
    ];
    hobbies.forEach(h => categories.push({ id: h, title: h, icon: "fa-brain", type: "hobby", subject: "상식/취미" }));

    function generateStageQuestions(cat, stageNum) {
      const qs = [];
      const dbPool = knowledgeDB[cat.title] || [];

      for (let i = 1; i <= 5; i++) {
        let questionText = '';
        let correctAnswer = '';
        let wrongOptions = [];
        let hintText = '';

        if (cat.subject === "수학") {
          const level = (cat.gradeLevel || 1);
          let a, b, opSymbol = '+';
          
          if (level <= 2) {
            a = Math.floor(Math.random() * (stageNum * 8)) + 1;
            b = Math.floor(Math.random() * (stageNum * 6)) + 1;
            correctAnswer = `${a + b}`;
          } else if (level <= 4) {
            const isSub = Math.random() > 0.5;
            if (isSub) {
              a = Math.floor(Math.random() * 30) + 20;
              b = Math.floor(Math.random() * 15) + 1;
              opSymbol = '-';
              correctAnswer = `${a - b}`;
            } else {
              a = Math.floor(Math.random() * 25) + 10;
              b = Math.floor(Math.random() * 25) + 10;
              correctAnswer = `${a + b}`;
            }
          } else {
            a = Math.floor(Math.random() * 9) + 2;
            b = Math.floor(Math.random() * 9) + 2;
            opSymbol = '×';
            correctAnswer = `${a * b}`;
          }

          questionText = `다음 연산의 값은? : ${a} ${opSymbol} ${b} = ?`;
          const numAns = parseInt(correctAnswer, 10);
          wrongOptions = [`${numAns + 2}`, `${numAns - 1 <= 0 ? numAns + 3 : numAns - 1}`, `${numAns + 5}`];
          hintText = `이 연산의 정확한 결과는 ${correctAnswer} 입니다.`;

        } else if (dbPool.length > 0) {
          // Fetch from realistic Knowledge DB
          const itemIndex = ((stageNum - 1) * 5 + (i - 1)) % dbPool.length;
          const quizItem = dbPool[itemIndex];

          questionText = quizItem.q;
          correctAnswer = quizItem.ans;
          wrongOptions = [...quizItem.wrong];
          hintText = `정답의 힌트는 "${correctAnswer.substring(0, 2)}..." 입니다.`;

        } else {
          // Dynamic Intelligent Fallback for non-indexed categories
          questionText = `'${cat.title}' 지식 탐구: Stage ${stageNum} - Q${i}. 다음 중 올바른 설명 또는 핵심 요소는 무엇일까요?`;
          correctAnswer = `${cat.title} 관련 대표 핵심 개념 ${i}`;
          wrongOptions = [
            `${cat.title} 관련 일반적 개념 A`,
            `${cat.title} 관련 잘못된 정보 B`,
            `${cat.title} 관련 연관 없는 설명 C`
          ];
          hintText = `정답은 "${correctAnswer}" 입니다.`;
        }

        const allOptions = [correctAnswer, ...wrongOptions];
        allOptions.sort(() => Math.random() - 0.5);

        qs.push({
          question: questionText,
          options: allOptions,
          answer: correctAnswer,
          hint: hintText
        });
      }
      return qs;
    }

    let currentFilter = 'all';
    let currentCat = null;
    let currentStage = 1;
    let currentQuestions = [];
    let currentQIdx = 0;
    let stageScore = 0;
    let correctCount = 0;
    let timerInterval = null;
    let activeMultiplier = 1;

    function updateHeaderUI() {
      document.getElementById('user-points').innerText = gameState.points;
      document.getElementById('total-stars').innerText = gameState.stars;
      document.getElementById('equipped-title').innerText = gameState.equippedTitle;
      document.getElementById('item-time-cnt').innerText = gameState.inventory.time;
      document.getElementById('item-hint-cnt').innerText = gameState.inventory.hint;
      document.getElementById('item-double-cnt').innerText = gameState.inventory.double;
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      if (viewId === 'category-view') renderCategories();
      if (viewId === 'title-view') renderTitles();
      updateHeaderUI();
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCategories();
    }

    function filterCategories() {
      renderCategories();
    }

    function renderCategories() {
      const grid = document.getElementById('category-grid');
      const search = document.getElementById('search-bar').value.toLowerCase();
      grid.innerHTML = '';

      categories.filter(c => {
        const matchesFilter = (currentFilter === 'all') || (c.type === currentFilter);
        const matchesSearch = c.title.toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      }).forEach(c => {
        const card = document.createElement('div');
        card.className = 'cat-card';
        card.onclick = () => selectCategory(c);
        card.innerHTML = `
          <div class="cat-icon"><i class="fa-solid ${c.icon}"></i></div>
          <div class="cat-title">${c.title}</div>
          <div class="cat-meta"><span>Stage 1~4</span></div>
        `;
        grid.appendChild(card);
      });
    }

    function selectCategory(cat) {
      currentCat = cat;
      document.getElementById('stage-cat-title').innerText = cat.title;
      renderStages();
      showView('stage-view');
    }

    function renderStages() {
      const grid = document.getElementById('stage-grid');
      grid.innerHTML = '';

      for (let s = 1; s <= 4; s++) {
        const key = `${currentCat.id}_s${s}`;
        const unlocked = s === 1 || (gameState.stageProgress[`${currentCat.id}_s${s-1}`]?.stars > 0);
        const stars = gameState.stageProgress[key]?.stars || 0;

        const card = document.createElement('div');
        card.className = `stage-card ${unlocked ? '' : 'locked'}`;
        card.onclick = () => { if (unlocked) startStage(s); };
        card.innerHTML = `
          <div class="stage-number">STAGE ${s}</div>
          <div class="stage-stars">
            ${'<i class="fa-solid fa-star"></i>'.repeat(stars)}
            ${'<i class="fa-regular fa-star"></i>'.repeat(3 - stars)}
          </div>
          <div>${unlocked ? '도전 가능' : '<i class="fa-solid fa-lock"></i> 잠김'}</div>
        `;
        grid.appendChild(card);
      }
    }

    function startStage(stageNum) {
      currentStage = stageNum;
      currentQuestions = generateStageQuestions(currentCat, stageNum);
      currentQIdx = 0;
      stageScore = 0;
      correctCount = 0;
      showView('quiz-view');
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQIdx >= currentQuestions.length) {
        endStage();
        return;
      }

      const q = currentQuestions[currentQIdx];
      document.getElementById('subject-badge').innerText = currentCat.subject || "일반";
      document.getElementById('quiz-num').innerText = `문제 ${currentQIdx + 1} / ${currentQuestions.length}`;
      document.getElementById('quiz-question').innerText = q.question;

      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.answer, btn);
        optionsGrid.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      const timerBar = document.getElementById('timer-bar');
      let timePercent = 100;
      
      timerInterval = setInterval(() => {
        timePercent -= 1;
        timerBar.style.width = timePercent + '%';
        if (timePercent <= 0) {
          clearInterval(timerInterval);
          playSound('wrong');
          nextQuestion();
        }
      }, 150);
    }

    function checkAnswer(selected, correct, btn) {
      clearInterval(timerInterval);
      const isCorrect = selected == correct;

      if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        stageScore += 100 * activeMultiplier;
        correctCount++;
        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
      } else {
        btn.classList.add('wrong');
        document.getElementById('quiz-card').classList.add('shake');
        setTimeout(() => document.getElementById('quiz-card').classList.remove('shake'), 400);
        playSound('wrong');
      }

      activeMultiplier = 1;
      setTimeout(nextQuestion, 1000);
    }

    function nextQuestion() {
      currentQIdx++;
      loadQuestion();
    }

    function useItem(type) {
      if (gameState.inventory[type] <= 0) {
        showModal("아이템이 부족합니다! 상점에서 구매하세요.");
        return;
      }
      gameState.inventory[type]--;
      if (type === 'time') {
        startTimer();
      } else if (type === 'hint') {
        showModal("💡 " + currentQuestions[currentQIdx].hint);
      } else if (type === 'double') {
        activeMultiplier = 2;
        showModal("⚡ 이번 문제 정답 점수가 2배가 됩니다!");
      }
      saveState();
    }

    function endStage() {
      const accuracy = (correctCount / currentQuestions.length) * 100;
      let earnedStars = 0;
      if (accuracy >= 100) earnedStars = 3;
      else if (accuracy >= 60) earnedStars = 2;
      else if (accuracy >= 40) earnedStars = 1;

      const key = `${currentCat.id}_s${currentStage}`;
      const prevStars = gameState.stageProgress[key]?.stars || 0;
      
      if (earnedStars > prevStars) {
        gameState.stars += (earnedStars - prevStars);
        gameState.stageProgress[key] = { stars: earnedStars };
      }

      gameState.points += stageScore;
      saveState();

      document.getElementById('result-title').innerText = earnedStars > 0 ? "STAGE CLEAR!" : "STAGE FAILED";
      document.getElementById('result-stars').innerHTML = '<i class="fa-solid fa-star"></i>'.repeat(earnedStars);
      document.getElementById('result-score').innerText = stageScore;
      document.getElementById('result-acc').innerText = accuracy.toFixed(0);

      showView('result-view');
    }

    function buyItem(type, price) {
      if (gameState.points < price) {
        showModal("포인트가 부족합니다!");
        return;
      }
      gameState.points -= price;
      gameState.inventory[type]++;
      saveState();
      showModal("구매가 완료되었습니다!");
    }

    const availableTitles = [
      "초보 퀴즈러", "지식 탐험가", "스피드 마스터", "퀴즈 왕국의 지배자", "퀴즈 재벌"
    ];

    function renderTitles() {
      const grid = document.getElementById('titles-grid');
      grid.innerHTML = '';

      availableTitles.forEach(t => {
        const isUnlocked = gameState.unlockedTitles.includes(t);
        const isEquipped = gameState.equippedTitle === t;

        const card = document.createElement('div');
        card.className = 'shop-item';
        card.innerHTML = `
          <h3><i class="fa-solid fa-award" style="color:#38bdf8;"></i> ${t}</h3>
          <p style="color:var(--text-sub);">${isUnlocked ? '해금 완료' : '업적 달성 필요'}</p>
          <button class="btn ${isEquipped ? 'btn-secondary' : ''}" onclick="equipTitle('${t}')" ${!isUnlocked ? 'disabled' : ''}>
            ${isEquipped ? '장착 중' : '장착하기'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function equipTitle(title) {
      gameState.equippedTitle = title;
      saveState();
      renderTitles();
    }

    window.onload = () => {
      renderCategories();
      updateHeaderUI();
    };
  </script>
</body>
</html>
