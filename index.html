<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Quiz Kingdom - 500 Categories & Search Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .title-font {
            font-family: 'Jua', sans-serif;
        }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .glow-purple {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

    <!-- 로그인 오버레이 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white text-2xl shadow-lg glow-purple mx-auto mb-3">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <h2 class="title-font text-2xl text-purple-400">Super Quiz Kingdom</h2>
                <p class="text-xs text-slate-400 mt-1">로그인 후 총 500개 카테고리의 퀴즈 왕국을 즐기세요!</p>
            </div>
            <div id="auth-tabs" class="flex rounded-xl bg-slate-800 p-1 mb-6">
                <button type="button" onclick="app.switchAuthMode('login')" id="tab-login" class="flex-1 py-2 text-sm font-bold rounded-lg bg-purple-600 text-white transition">로그인</button>
                <button type="button" onclick="app.switchAuthMode('signup')" id="tab-signup" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition">회원가입</button>
            </div>
            <form id="auth-form" onsubmit="app.handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">아이디</label>
                    <input type="text" id="auth-username" placeholder="사용할 아이디 입력" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">비밀번호</label>
                    <input type="password" id="auth-password" placeholder="비밀번호 입력" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl text-white shadow-lg transition">
                    로그인 하기
                </button>
            </form>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass border-b border-slate-700/50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navTo('home')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white text-xl shadow-lg glow-purple">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div>
                    <h1 class="title-font text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                        Super Quiz Kingdom
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">전 국민 지식 판타지 퀴즈 왕국 (총 500개 카테고리)</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800/80 border border-purple-500/30 text-xs font-semibold text-purple-300">
                    <i class="fa-solid fa-award text-amber-400"></i>
                    <span id="header-user-title">퀴즈 초보자</span>
                </div>
                <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 font-bold text-sm">
                    <i class="fa-solid fa-coins text-amber-400 animate-pulse"></i>
                    <span id="header-user-points">0</span> P
                </div>
                <button onclick="app.toggleSound()" id="sound-toggle-btn" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-400 border border-slate-700 transition" title="소리 켜기/끄기">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
                </button>
                <button onclick="app.navTo('shop')" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 transition" title="포인트 상점">
                    <i class="fa-solid fa-store text-lg"></i>
                </button>
                <button onclick="app.navTo('inventory')" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-400 border border-slate-700 transition" title="칭호 보관함">
                    <i class="fa-solid fa-medal text-lg"></i>
                </button>
                <button onclick="app.openCustomModal()" class="p-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white shadow-md transition" title="문제 직접 만들기">
                    <i class="fa-solid fa-plus text-lg"></i>
                </button>
                <button onclick="app.logout()" class="p-2.5 rounded-xl bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-700/50 transition" title="로그아웃">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    </main>

    <!-- Custom Question Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <button onclick="app.closeCustomModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="title-font text-2xl text-purple-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> 나만의 퀴즈 추가하기
            </h2>
            <form id="custom-quiz-form" onsubmit="app.handleSaveCustomQuiz(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">카테고리 선택</label>
                    <select id="modal-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">과목 / 태그</label>
                    <input type="text" id="modal-tag" placeholder="[상식]" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">질문 내용</label>
                    <textarea id="modal-question" rows="3" placeholder="퀴즈 질문을 입력해 주세요." required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-purple-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">보기 옵션 (4개)</label>
                    <div class="space-y-2">
                        <input type="text" id="modal-opt-0" placeholder="보기 1" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                        <input type="text" id="modal-opt-1" placeholder="보기 2" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                        <input type="text" id="modal-opt-2" placeholder="보기 3" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                        <input type="text" id="modal-opt-3" placeholder="보기 4" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">정답 인덱스</label>
                    <select id="modal-answer" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200">
                        <option value="0">보기 1번이 정답</option>
                        <option value="1">보기 2번이 정답</option>
                        <option value="2">보기 3번이 정답</option>
                        <option value="3">보기 4번이 정답</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">해설 / 설명</label>
                    <input type="text" id="modal-explanation" placeholder="정답 풀이 및 해설" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl text-white shadow-lg transition">
                    퀴즈 등록 완료
                </button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none px-4 py-3 rounded-xl bg-slate-800 border border-purple-500 text-white shadow-2xl flex items-center gap-3">
        <i id="toast-icon" class="fa-solid fa-circle-info text-purple-400"></i>
        <span id="toast-message" class="text-sm font-medium">메시지 내용</span>
    </div>

    <!-- Footer -->
    <footer class="glass border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-500 mt-auto">
        <p>© 2026 Super Quiz Kingdom. 총 500개 카테고리 & 실시간 검색 시스템 적용.</p>
    </footer>

            init() {
                const savedUser = localStorage.getItem('SQK_DEVICE_LOCAL_USER');
                if (savedUser) {
                    this.currentUser = JSON.parse(savedUser);
                    if (!this.currentUser.bestRecords) this.currentUser.bestRecords = {};
                    if (!this.currentUser.items) this.currentUser.items = {};

                } else {
                    document.getElementById('login-modal').classList.remove('hidden');
                }

            switchAuthMode(mode) {
                this.authMode = mode;
                const loginTab = document.getElementById('tab-login');
                const signupTab = document.getElementById('tab-signup');
                const submitBtn = document.getElementById('auth-submit-btn');

                if (mode === 'login') {
                    loginTab.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-purple-600 text-white transition";

                    submitBtn.innerText = "회원가입 하기";

            }

            handleAuthSubmit(e) {
                e.preventDefault();
                const usernameInput = document.getElementById('auth-username').value.trim();
                const passwordInput = document.getElementById('auth-password').value.trim();

                if (!usernameInput || !passwordInput) {
                    this.showToast('아이디와 비밀번호를 입력해주세요.', 'error');
                    return;
                }

                let usersDB = JSON.parse(localStorage.getItem('SQK_DEVICE_USERS_DB') || '{}');

                if (this.authMode === 'signup') {
                    if (usersDB[usernameInput]) {
                        this.showToast('이미 존재하는 아이디입니다.', 'error');
                        return;
                    }
                    const newUser = {
                        username: usernameInput,
                        password: passwordInput,
                        points: 200,
                        title: '퀴즈 초보자',
                        inventory: [],
                        items: {},
                        customQuestions: [],
                        bestRecords: {}
                    };
                    usersDB[usernameInput] = newUser;
                    localStorage.setItem('SQK_DEVICE_USERS_DB', JSON.stringify(usersDB));
                    
                    this.currentUser = newUser;
                    localStorage.setItem('SQK_DEVICE_LOCAL_USER', JSON.stringify(newUser));
                    document.getElementById('login-modal').classList.add('hidden');
                    this.showToast('회원가입 성공! 축하 포인트 200P가 지급되었습니다.', 'success');
                    this.updateHeader();
                    this.navTo('home');
                } else {
                    const user = usersDB[usernameInput];
                    if (!user || user.password !== passwordInput) {
                        this.showToast('아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
                        return;
                    }
                    if (!user.bestRecords) user.bestRecords = {};
                    if (!user.items) user.items = {};
                    this.currentUser = user;
                    localStorage.setItem('SQK_DEVICE_LOCAL_USER', JSON.stringify(user));
                    document.getElementById('login-modal').classList.add('hidden');
                    this.showToast(`${user.username}님 환영합니다!`, 'success');
                    this.updateHeader();
                    this.navTo('home');
                }
            }

                this.stopTimer();
                localStorage.removeItem('SQK_DEVICE_LOCAL_USER');
                this.currentUser = null;

                const toast = document.getElementById('toast');
                const messageEl = document.getElementById('toast-message');
                const iconEl = document.getElementById('toast-icon');

                messageEl.innerText = message;
                if (type === 'success') iconEl.className = "fa-solid fa-circle-check text-green-400";
                else if (type === 'error') iconEl.className = "fa-solid fa-circle-exclamation text-red-400";
                else iconEl.className = "fa-solid fa-circle-info text-purple-400";

                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            formatTime(ms) {
                if (!ms || ms === Infinity) return "기록 없음";
                const totalSec = Math.floor(ms / 1000);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                const milli = Math.floor((ms % 1000) / 10);
                
                if (min > 0) {
                    return `${min}분 ${sec.toString().padStart(2, '0')}초 ${milli.toString().padStart(2, '0')}`;
                }
                return `${sec}.${milli.toString().padStart(2, '0')}초`;
            }

                    const timerEl = document.getElementById('live-stopwatch');

                    <div class="glass border border-purple-500/30 rounded-2xl p-6 mb-8 text-center bg-gradient-to-r from-purple-900/20 to-pink-900/20">
                        <h2 class="title-font text-3xl text-purple-300 mb-2">${category.icon} ${category.name}</h2>
                        <p class="text-slate-300 text-sm mb-4">Stage 1부터 시작하면 <strong class="text-amber-400">타임어택 모드가 자동 활성화</strong>됩니다!</p>
                        <button onclick="app.startFullTimeAttack('${catId}')" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-pink-600 hover:from-amber-400 hover:to-pink-500 font-bold rounded-xl text-slate-950 shadow-lg text-base transition flex items-center gap-2 mx-auto">
                            <i class="fa-solid fa-bolt text-lg"></i> Stage 1부터 타임어택 시작!
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                `;

                for (let stage = 1; stage <= 4; stage++) {
                    html += `
                        <div onclick="app.startQuiz('${catId}', ${stage})" class="glass border border-slate-700 hover:border-purple-500 rounded-2xl p-6 text-center cursor-pointer transition transform hover:-translate-y-1 shadow-lg">
                            <div class="w-12 h-12 rounded-full bg-purple-600/20 text-purple-400 font-bold text-lg flex items-center justify-center mx-auto mb-3 border border-purple-500/30">
                                ${stage}
                            </div>
                            <h3 class="title-font text-lg text-slate-200">Stage ${stage}</h3>
                            <p class="text-xs text-slate-400 mt-1">개별 연습 모드</p>
                        </div>
                    `;
                }

                html += `</div>`;
                container.innerHTML = html;
            }

            startFullTimeAttack(catId) {
                this.activeCategory = catId;
                this.currentStage = 1;
                this.currentQuestionIdx = 0;
                this.score = 0;
                this.hasFlawlessRun = true;
                this.timerPausedOffset = 0;
                this.startTimer();
                this.navTo('quiz');
                this.showToast('⏱️ 타임어택 시작! 한 문제도 틀리지 마세요!', 'info');
            }

            startQuiz(catId, stage) {
                this.activeCategory = catId;
                this.currentStage = stage;
                this.currentQuestionIdx = 0;
                this.score = 0;
                if (stage === 1 && !this.timeAttackActive) {
                    this.hasFlawlessRun = true;
                    this.timerPausedOffset = 0;
                    this.startTimer();
                }
                this.navTo('quiz');
            }

            getCurrentQuestions() {
                let questions = [];
                if (QUESTIONS_DB[this.activeCategory] && QUESTIONS_DB[this.activeCategory][this.currentStage]) {
                    questions = [...QUESTIONS_DB[this.activeCategory][this.currentStage]];
                }
                if (this.currentUser && this.currentUser.customQuestions) {
                    const customQ = this.currentUser.customQuestions.filter(q => q.category === this.activeCategory);
                    questions = questions.concat(customQ);
                }
                if (questions.length === 0) {
                    questions = [
                        { q: "등록된 퀴즈가 없습니다.", opts: ["확인", "확인", "확인", "확인"], a: 0, exp: "우측 상단 + 버튼으로 퀴즈를 추가할 수 있습니다." }
                    ];
                }
                return questions;
            }

            renderQuiz(container) {
                const questions = this.getCurrentQuestions();
                const q = questions[this.currentQuestionIdx];
                const progress = ((this.currentQuestionIdx + 1) / questions.length) * 100;
                const currentTimerText = this.timeAttackActive ? this.formatTime(Date.now() - this.startTime) : "0.00초";

                const fiftyCount = this.currentUser.items && this.currentUser.items['item_fifty'] ? this.currentUser.items['item_fifty'] : 0;
                const freezeCount = this.currentUser.items && this.currentUser.items['item_freeze'] ? this.currentUser.items['item_freeze'] : 0;
                const skipCount = this.currentUser.items && this.currentUser.items['item_skip'] ? this.currentUser.items['item_skip'] : 0;
                const boostCount = this.currentUser.items && this.currentUser.items['item_boost'] ? this.currentUser.items['item_boost'] : 0;

                let html = `
                    <div class="max-w-2xl mx-auto">
                        <div class="glass border border-amber-500/40 rounded-2xl p-4 mb-4 flex items-center justify-between shadow-lg glow-amber">
                            <div class="flex items-center gap-2 text-amber-400 font-bold text-sm">
                                <i class="fa-solid fa-stopwatch animate-pulse text-lg"></i>
                                <span>타임어택 진행 중</span>
                            </div>
                            <div id="live-stopwatch" class="title-font text-2xl text-amber-300 font-bold tracking-wider">
                                ${currentTimerText}
                            </div>
                            <div class="text-xs ${this.hasFlawlessRun ? 'text-green-400' : 'text-red-400'} font-bold">
                                ${this.hasFlawlessRun ? 'PERFECT 모드' : '❌ 기록 무효 (오답)'}
                            </div>
                        </div>

                        <!-- 실전 퀴즈 아이템 사용 패널 -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                            <button onclick="app.useItem('item_fifty')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 flex items-center justify-between transition">
                                <span>💡 50:50 찬스</span>
                                <span class="px-2 py-0.5 rounded bg-purple-600/50 text-purple-300 font-bold">${fiftyCount}개</span>
                            </button>
                            <button onclick="app.useItem('item_freeze')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 flex items-center justify-between transition">
                                <span>⏱️ 타임 프리즈</span>
                                <span class="px-2 py-0.5 rounded bg-purple-600/50 text-purple-300 font-bold">${freezeCount}개</span>
                            </button>
                            <button onclick="app.useItem('item_skip')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 flex items-center justify-between transition">
                                <span>⏭️ 문제 패스</span>
                                <span class="px-2 py-0.5 rounded bg-purple-600/50 text-purple-300 font-bold">${skipCount}개</span>
                            </button>
                            <button onclick="app.useItem('item_boost')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 flex items-center justify-between transition">
                                <span>💰 포인트 2배</span>
                                <span class="px-2 py-0.5 rounded bg-amber-600/50 text-amber-300 font-bold">${boostCount}회</span>
                            </button>
                        </div>

                        <div class="flex items-center justify-between mb-3">
                            <button onclick="app.navTo('stages', '${this.activeCategory}')" class="text-slate-400 hover:text-white text-sm font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-xmark"></i> 나가기
                            </button>
                            <span class="text-xs font-bold text-purple-400 bg-purple-950/50 px-3 py-1 rounded-full border border-purple-500/30">
                                Stage ${this.currentStage} / 4 - 문제 ${this.currentQuestionIdx + 1}/${questions.length}
                            </span>
                        </div>

                        <div class="w-full bg-slate-800 h-2 rounded-full mb-6 overflow-hidden">
                            <div class="bg-gradient-to-r from-purple-500 to-pink-500 h-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="glass border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl mb-6">
                            <h3 class="text-lg sm:text-xl font-bold text-slate-100 mb-6 leading-relaxed">
                                Q. ${q.q}
                            </h3>
                            <div class="space-y-3" id="options-container">
                `;

                q.opts.forEach((opt, idx) => {
                    html += `
                        <button id="opt-btn-${idx}" onclick="app.submitAnswer(${idx}, ${q.a}, '${q.exp.replace(/'/g, "\\'")}')" class="w-full text-left p-4 rounded-xl bg-slate-800/80 hover:bg-purple-600/20 border border-slate-700 hover:border-purple-500 text-slate-200 font-medium transition flex items-center justify-between group">
                            <span><strong class="text-purple-400 mr-2">${idx + 1}.</strong> ${opt}</span>
                            <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-purple-400 transition"></i>
                        </button>
                    `;
                });

                html += `
                            </div>
                        </div>

                        <div id="explanation-box" class="hidden glass border border-purple-500/50 rounded-2xl p-6 text-slate-200">
                            <h4 id="result-title" class="title-font text-lg font-bold mb-2"></h4>
                            <p id="result-desc" class="text-sm text-slate-300 mb-4"></p>
                            <button onclick="app.nextQuestion()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl text-white shadow-lg transition">
                                다음으로 이동
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }

            useItem(itemId) {
                if (!this.currentUser.items || !this.currentUser.items[itemId] || this.currentUser.items[itemId] <= 0) {
                    this.showToast('보유 중인 아이템이 없습니다. 상점에서 구매하세요!', 'error');
                    return;
                }

                const questions = this.getCurrentQuestions();
                const q = questions[this.currentQuestionIdx];

                if (itemId === 'item_fifty') {
                    this.currentUser.items[itemId]--;
                    this.syncUserData();
                    
                    let hiddenCount = 0;
                    q.opts.forEach((opt, idx) => {
                        if (idx !== q.a && hiddenCount < 2) {
                            const btn = document.getElementById(`opt-btn-${idx}`);
                            if (btn) {
                                btn.style.opacity = '0.3';
                                btn.style.pointerEvents = 'none';
                                btn.innerText = "(제거된 오답)";
                                hiddenCount++;
                            }
                        }
                    });
                    this.showToast('💡 50:50 찬스 발동! 오답 2개가 지워졌습니다.', 'success');
                    this.renderQuiz(document.getElementById('app-container'));
                } 
                else if (itemId === 'item_freeze') {
                    this.currentUser.items[itemId]--;
                    this.syncUserData();
                    
                    this.stopTimer();
                    this.showToast('⏱️ 타임 프리즈 발동! 5초 동안 시간이 멈춥니다.', 'success');
                    setTimeout(() => {
                        if (this.timeAttackActive === false && this.currentView === 'quiz') {
                            this.startTimer();
                            this.showToast('⏱️ 타임 프리즈 종료! 타이머가 재개됩니다.', 'info');
                        }
                    }, 5000);
                }
                else if (itemId === 'item_skip') {
                    this.currentUser.items[itemId]--;
                    this.syncUserData();
                    this.showToast('⏭️ 문제 패스! 정답 처리되고 다음으로 넘어갑니다.', 'success');
                    this.score += 20;
                    let earnedPoints = 20;
                    if (this.currentUser.items && this.currentUser.items['item_boost'] && this.currentUser.items['item_boost'] > 0) {
                        this.currentUser.items['item_boost']--;
                        earnedPoints *= 2;
                        this.showToast('💰 포인트 2배 부스터 적용 (+40P)!', 'success');
                    }
                    this.currentUser.points += earnedPoints;
                    this.syncUserData();
                    this.nextQuestion();
                }
                else if (itemId === 'item_boost') {
                    this.showToast('💰 포인트 2배 부스터는 정답을 맞힐 때 자동 적용됩니다!', 'info');
                }
            }

            submitAnswer(selectedIdx, correctIdx, explanation) {
                const optionsContainer = document.getElementById('options-container');
                const buttons = optionsContainer.getElementsByTagName('button');
                
                for (let btn of buttons) {
                    btn.disabled = true;
                }

                const isCorrect = (selectedIdx === correctIdx);
                if (isCorrect) {
                    buttons[selectedIdx].classList.add('bg-green-600/30', 'border-green-500', 'text-green-200');
                } else {
                    this.hasFlawlessRun = false;
                    buttons[selectedIdx].classList.add('bg-red-600/30', 'border-red-500', 'text-red-200');
                    buttons[correctIdx].classList.add('bg-green-600/30', 'border-green-500', 'text-green-200');
                }

                const expBox = document.getElementById('explanation-box');
                const resTitle = document.getElementById('result-title');
                const resDesc = document.getElementById('result-desc');

                expBox.classList.remove('hidden');
                
                let earnedPoints = 20;
                let boostUsed = false;
                if (isCorrect) {
                    if (this.currentUser && this.currentUser.items && this.currentUser.items['item_boost'] && this.currentUser.items['item_boost'] > 0) {
                        this.currentUser.items['item_boost']--;
                        earnedPoints *= 2;
                        boostUsed = true;
                    }
                    this.score += earnedPoints;
                    resTitle.innerHTML = `<i class="fa-solid fa-circle-check text-green-400 mr-2"></i> 정답입니다! (+${earnedPoints}P ${boostUsed ? '🔥 2배 부스터!' : ''})`;
                    resTitle.className = "title-font text-lg font-bold mb-2 text-green-400";
                } else {
                    resTitle.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-400 mr-2"></i> 오답입니다! (기록 무효)`;
                    resTitle.className = "title-font text-lg font-bold mb-2 text-red-400";
                }
                resDesc.innerText = explanation;

                if (isCorrect && this.currentUser) {
                    this.currentUser.points += earnedPoints;
                    this.syncUserData();
                }
            }

            nextQuestion() {
                const questions = this.getCurrentQuestions();
                this.currentQuestionIdx++;

                if (this.currentQuestionIdx < questions.length) {
                    this.renderQuiz(document.getElementById('app-container'));
                } else {
                    if (this.currentStage < 4) {
                        this.currentStage++;
                        this.currentQuestionIdx = 0;
                        this.renderQuiz(document.getElementById('app-container'));
                    } else {
                        this.finishTimeAttackRun();
                    }
                }
            }

            finishTimeAttackRun() {
                const totalTimeMs = Date.now() - this.startTime;
                this.stopTimer();

                let isNewBest = false;

                if (this.hasFlawlessRun) {
                    const prevBest = this.currentUser.bestRecords[this.activeCategory] || Infinity;
                    if (totalTimeMs < prevBest) {
                        this.currentUser.bestRecords[this.activeCategory] = totalTimeMs;
                        this.syncUserData();
                        isNewBest = true;
                    }
                }

                this.renderFinalResult(document.getElementById('app-container'), totalTimeMs, isNewBest);
            }

            renderFinalResult(container, totalTimeMs, isNewBest) {
                const formattedTime = this.formatTime(totalTimeMs);
                const category = CATEGORIES_DATA.find(c => c.id === this.activeCategory);

                let statusHtml = "";
                if (this.hasFlawlessRun) {
                    if (isNewBest) {
                        statusHtml = `
                            <div class="px-4 py-2 rounded-xl bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold text-sm mb-4 animate-bounce">
                                🎉 🎉 신기록 달성! 최고 기록이 갱신되었습니다! 🎉 🎉
                            </div>
                        `;
                    } else {
                        statusHtml = `
                            <div class="px-4 py-2 rounded-xl bg-green-500/20 border border-green-500/50 text-green-300 font-bold text-sm mb-4">
                                ✨ 퍼펙트 완주 성공! (기존 기록 유지)
                            </div>
                        `;
                    }
                } else {
                    statusHtml = `
                        <div class="px-4 py-2 rounded-xl bg-red-500/20 border border-red-500/50 text-red-300 font-bold text-sm mb-4">
                            ❌ 오답이 발생하여 타임어택 최고기록에 인정되지 않습니다.
                        </div>
                    `;
                }

                let html = `
                    <div class="max-w-md mx-auto text-center glass border border-slate-700 rounded-3xl p-8 shadow-2xl mt-6">
                        <div class="w-20 h-20 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg glow-amber">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h2 class="title-font text-3xl font-bold mb-1 text-slate-100">${category.name}</h2>
                        <p class="text-slate-400 text-xs mb-6">Stage 1 ~ 4 타임어택 결과</p>
                        
                        ${statusHtml}

                        <div class="bg-slate-800/80 rounded-2xl p-5 mb-6 border border-slate-700 space-y-3">
                            <div>
                                <p class="text-xs text-slate-400">이번 도전 시간</p>
                                <p class="title-font text-3xl text-amber-300 mt-1">${formattedTime}</p>
                            </div>
                            <div class="pt-3 border-t border-slate-700/60 flex justify-between text-xs">
                                <span class="text-slate-400">현재 카테고리 최고 기록</span>
                                <span class="font-bold text-purple-300">${this.formatTime(this.currentUser.bestRecords[this.activeCategory])}</span>
                            </div>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="app.startFullTimeAttack('${this.activeCategory}')" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 font-bold rounded-xl text-slate-950 transition shadow-lg">
                                다시 도전
                            </button>
                            <button onclick="app.navTo('home')" class="flex-1 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl text-white shadow-lg transition">
                                목록으로
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }

            openCustomModal() {
                const select = document.getElementById('modal-category');
                select.innerHTML = '';
                CATEGORIES_DATA.forEach(cat => {
                    select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                });
                document.getElementById('custom-modal').classList.remove('hidden');
            }

            closeCustomModal() {
                document.getElementById('custom-modal').classList.add('hidden');
            }

            handleSaveCustomQuiz(e) {
                e.preventDefault();
                const category = document.getElementById('modal-category').value;
                const tag = document.getElementById('modal-tag').value;
                const question = document.getElementById('modal-question').value;
                const opts = [
                    document.getElementById('modal-opt-0').value,
                    document.getElementById('modal-opt-1').value,
                    document.getElementById('modal-opt-2').value,
                    document.getElementById('modal-opt-3').value
                ];
                const answer = parseInt(document.getElementById('modal-answer').value);
                const explanation = document.getElementById('modal-explanation').value;

                const newQuiz = { q: `${tag} ${question}`, opts, a: answer, exp: explanation, category };

                if (!this.currentUser.customQuestions) {
                    this.currentUser.customQuestions = [];
                }
                this.currentUser.customQuestions.push(newQuiz);
                this.syncUserData();
                this.closeCustomModal();
                this.showToast('나만의 퀴즈가 등록되었습니다!', 'success');
                document.getElementById('custom-quiz-form').reset();
            }

            renderShop(container) {
                let html = `
                    <div class="max-w-4xl mx-auto">
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="app.navTo('home')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold flex items-center gap-2 transition">
                                <i class="fa-solid fa-arrow-left"></i> 홈으로
                            </button>
                            <h2 class="title-font text-2xl text-amber-300 flex items-center gap-2"><i class="fa-solid fa-store"></i> 포인트 상점</h2>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                `;

                SHOP_ITEMS.forEach(item => {
                    const ownedTitle = item.type === 'title' && this.currentUser.inventory && this.currentUser.inventory.includes(item.id);
                    html += `
                        <div class="glass border border-slate-700 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl mb-4 border border-amber-500/30">
                                    <i class="fa-solid fa-award"></i>
                                </div>
                                <h3 class="title-font text-lg text-slate-100 mb-1">${item.name}</h3>
                                <p class="text-xs text-slate-400 mb-4">${item.desc}</p>
                            </div>
                            <div>
                                <p class="title-font text-amber-400 text-lg mb-3">${item.price} P</p>
                                <button onclick="app.buyItem('${item.id}', ${item.price}, '${item.type}')" ${ownedTitle ? 'disabled' : ''} class="w-full py-2.5 rounded-xl font-bold text-sm transition ${ownedTitle ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg'}">
                                    ${ownedTitle ? '보유 중' : '구매하기'}
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML = html;
            }

            buyItem(itemId, price, type) {
                if (this.currentUser.points < price) {
                    this.showToast('포인트가 부족합니다!', 'error');
                    return;
                }
                this.currentUser.points -= price;

                if (type === 'title') {
                    if (!this.currentUser.inventory) this.currentUser.inventory = [];
                    this.currentUser.inventory.push(itemId);
                } else {
                    if (!this.currentUser.items) this.currentUser.items = {};
                    if (itemId === 'item_boost') {
                        this.currentUser.items[itemId] = (this.currentUser.items[itemId] || 0) + 3;
                    } else {
                        this.currentUser.items[itemId] = (this.currentUser.items[itemId] || 0) + 3;
                    }
                }

                this.syncUserData();
                this.showToast('아이템을 성공적으로 구매했습니다!', 'success');
                this.renderShop(document.getElementById('app-container'));
            }

            renderInventory(container) {
                const titles = [
                    { id: 'title_1', name: '🧠 척척박사' },
                    { id: 'title_2', name: '👑 퀴즈 마스터' },
                    { id: 'title_3', name: '⚡ 지식의 신' }
                ];

                const fiftyCnt = this.currentUser.items && this.currentUser.items['item_fifty'] ? this.currentUser.items['item_fifty'] : 0;
                const freezeCnt = this.currentUser.items && this.currentUser.items['item_freeze'] ? this.currentUser.items['item_freeze'] : 0;
                const skipCnt = this.currentUser.items && this.currentUser.items['item_skip'] ? this.currentUser.items['item_skip'] : 0;
                const boostCnt = this.currentUser.items && this.currentUser.items['item_boost'] ? this.currentUser.items['item_boost'] : 0;

                let html = `
                    <div class="max-w-4xl mx-auto">
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="app.navTo('home')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold flex items-center gap-2 transition">
                                <i class="fa-solid fa-arrow-left"></i> 홈으로
                            </button>
                            <h2 class="title-font text-2xl text-purple-300 flex items-center gap-2"><i class="fa-solid fa-medal"></i> 보관함 (칭호 및 도우미 아이템)</h2>
                        </div>

                        <h3 class="title-font text-xl text-slate-200 mb-4">보유 중인 퀴즈 도우미 아이템</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
                            <div class="glass border border-slate-700 rounded-2xl p-4 text-center">
                                <p class="text-sm text-slate-400 mb-1">💡 50:50 찬스</p>
                                <p class="title-font text-2xl text-purple-400">${fiftyCnt} 개</p>
                            </div>
                            <div class="glass border border-slate-700 rounded-2xl p-4 text-center">
                                <p class="text-sm text-slate-400 mb-1">⏱️ 타임 프리즈</p>
                                <p class="title-font text-2xl text-purple-400">${freezeCnt} 개</p>
                            </div>
                            <div class="glass border border-slate-700 rounded-2xl p-4 text-center">
                                <p class="text-sm text-slate-400 mb-1">⏭️ 문제 패스</p>
                                <p class="title-font text-2xl text-purple-400">${skipCnt} 개</p>
                            </div>
                            <div class="glass border border-slate-700 rounded-2xl p-4 text-center">
                                <p class="text-sm text-slate-400 mb-1">💰 2배 부스터</p>
                                <p class="title-font text-2xl text-amber-400">${boostCnt} 회</p>
                            </div>
                        </div>

                        <h3 class="title-font text-xl text-slate-200 mb-4">칭호 보관함</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                `;

                titles.forEach(t => {
                    const unlocked = this.currentUser.inventory && this.currentUser.inventory.includes(t.id);
                    const equipped = this.currentUser.title === t.name;

                    html += `
                        <div class="glass border ${equipped ? 'border-purple-500 glow-purple' : 'border-slate-700'} rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-xl mb-4 border border-purple-500/30">
                                    <i class="fa-solid fa-award"></i>
                                </div>
                                <h3 class="title-font text-lg text-slate-100 mb-1">${t.name}</h3>
                                <p class="text-xs text-slate-400 mb-4">${unlocked ? '획득 완료된 칭호입니다.' : '상점에서 구매하여 잠금 해제하세요.'}</p>
                            </div>
                            <div>
                                <button onclick="app.equipTitle('${t.name}')" ${!unlocked || equipped ? 'disabled' : ''} class="w-full py-2.5 rounded-xl font-bold text-sm transition ${equipped ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 cursor-default' : unlocked ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}">
                                    ${equipped ? '착용 중' : unlocked ? '칭호 착용하기' : '잠김'}
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML = html;
            }

            equipTitle(titleName) {
                this.currentUser.title = titleName;
                this.syncUserData();
                this.showToast(`'${titleName}' 칭호를 착용했습니다!`, 'success');
                this.renderInventory(document.getElementById('app-container'));
            }
        }

        const app = new QuizApp();
    </script>
</body>
</html>
